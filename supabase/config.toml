project_id = "rxhthyqirdafhkymztvb"

# The values below are the source of truth for local `supabase` CLI usage.
# The hosted Supabase project's Auth Settings must be updated in the dashboard
# to match — see the deployment notes in the repo README.
[auth]
site_url = "https://asvior.app"
additional_redirect_urls = [
  "https://asvior.app",
  "https://asvior.app/*",
  "https://asvior.app/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
